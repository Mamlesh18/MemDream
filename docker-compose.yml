# Local development stack.
#
#   cp .env.example .env      # fill in AZURE_OPENAI_* (or set the fake providers)
#   docker compose up --build
#
#   API   http://localhost:8000/docs
#   Mongo mongodb://localhost:27017
#
# **Two containers, and one of them is the database.** Synthesis runs inside the
# API in a bounded pool of tasks, so there is no worker container and no broker.
#
# There is no vector-store container either: FAISS is an in-process library, not
# a server. Its index lives on the `faiss-index` volume. That is also why the API
# is not scaled beyond one replica here — two processes writing one FAISS
# directory need the inter-process file lock, and past that you want a vector
# store that is actually a service. See docs/architecture.md.

name: memdream

services:
  api:
    build: .
    container_name: memdream-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DREAM_MONGODB_URI: mongodb://mongo:27017
      DREAM_FAISS_PATH: /data/faiss
      # Synthesis runs here, in this process. Nothing else to deploy.
      DREAM_QUEUE_PROVIDER: inline
      DREAM_CONFIG_FILE: /app/config/dream.yaml
      # The starter prompts, baked into the image. Mount your own over
      # /app/prompts, or set this to a path you mount.
      DREAM_PROMPTS_DIR: /app/prompts
    volumes:
      - faiss-index:/data/faiss
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: memdream-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Running several API replicas that should share one synthesis queue? Set
  # DREAM_QUEUE_PROVIDER=database on the api service and add:
  #
  #   worker:
  #     build: .
  #     command: ["python", "-m", "app.workers.synthesis_worker"]
  #     env_file: [.env]
  #     environment:
  #       DREAM_MONGODB_URI: mongodb://mongo:27017
  #       DREAM_QUEUE_PROVIDER: database
  #       DREAM_FAISS_PATH: /data/faiss
  #     volumes: [faiss-index:/data/faiss]
  #     depends_on: {mongo: {condition: service_healthy}}
  #
  # Still no broker — the jobs collection is the queue.

volumes:
  mongo-data:
  faiss-index:
