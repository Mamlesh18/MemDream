# Local development stack.
#
#   cp .env.example .env      # fill in AZURE_OPENAI_* (or set the fake providers)
#   docker compose up --build
#
#   API   http://localhost:8000/docs
#   Mongo mongodb://localhost:27017
#
# There is no separate vector-store container: FAISS is an in-process library,
# not a server. The index lives on the `faiss-index` volume, mounted into both
# the API and the worker, which coordinate writes with an inter-process file
# lock. That is also why the API is not scaled beyond one replica here — see
# docs/architecture.md for what to change before you do.

name: dream-memory

services:
  api:
    build: .
    container_name: dream-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DREAM_MONGODB_URI: mongodb://mongo:27017
      DREAM_REDIS_URL: redis://redis:6379/0
      DREAM_FAISS_PATH: /data/faiss
      DREAM_QUEUE_PROVIDER: arq
      DREAM_CONFIG_FILE: /app/config/dream.yaml
    volumes:
      - faiss-index:/data/faiss
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: dream-worker
    restart: unless-stopped
    command: ["arq", "app.workers.synthesis_worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      DREAM_MONGODB_URI: mongodb://mongo:27017
      DREAM_REDIS_URL: redis://redis:6379/0
      DREAM_FAISS_PATH: /data/faiss
      DREAM_CONFIG_FILE: /app/config/dream.yaml
      # Enable to run the nightly sweep across every user.
      DREAM_DREAM__SYNTHESIS__SCHEDULE_ENABLED: "false"
    volumes:
      - faiss-index:/data/faiss
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: dream-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: dream-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
  redis-data:
  faiss-index:
