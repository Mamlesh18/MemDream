[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memdream"
version = "0.1.0"
description = "MemDream - a self-maintaining long-term memory layer for AI agents: recall, remember, and dream (supersede / merge / synthesise)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "MemDream contributors" }]
keywords = ["llm", "memory", "agents", "rag", "vector-search", "mongodb", "faiss"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "motor>=3.4",
    "pymongo>=4.7",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "openai>=1.40",
    "httpx>=0.27",
    "structlog>=24.1",
    "filelock>=3.14",
    "PyYAML>=6.0",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Vector backends. Each is lazily imported, so installing one costs nothing for
# the others: pip install memdream[qdrant]
qdrant = ["qdrant-client>=1.9"]
pgvector = ["asyncpg>=0.29"]
# The canonical store on Postgres. Same driver as the pgvector backend, so
# running both against one database costs no extra dependency.
postgres = ["asyncpg>=0.29"]
chroma = ["chromadb>=0.5"]
pinecone = ["pinecone>=5.0"]
milvus = ["pymilvus>=2.4"]
azure-search = ["azure-search-documents>=11.5", "azure-core>=1.30"]

# LLM / embedding SDKs. OpenAI, Azure, Groq, Ollama, Together and Fireworks all
# go through the `openai` package, which is a base dependency; only these two
# need their own SDK.
gemini = ["google-genai>=1.0"]
anthropic = ["anthropic>=0.40"]

otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mongomock-motor>=0.0.29",
    "ruff>=0.5",
    "mypy>=1.10",
    "anyio>=4.4",
]

[project.urls]
Homepage = "https://github.com/your-org/memdream"
Documentation = "https://github.com/your-org/memdream/tree/main/docs"
Issues = "https://github.com/your-org/memdream/issues"

[project.scripts]
memdream-eval = "eval.run:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "memdream"]

# Starter prompts, so `python -m memdream prompts ./prompts` works from a
# pip install. They are templates, never loaded unless configuration points
# at them.
[tool.hatch.build.targets.wheel.force-include]
"prompts" = "memdream/templates/prompts"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: tests that need a live MongoDB / Postgres / Azure OpenAI",
    "slow: long-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
