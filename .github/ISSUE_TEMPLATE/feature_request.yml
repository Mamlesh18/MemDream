name: Feature request
description: Suggest a capability, provider or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, before any particular solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like MemDream to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Including workarounds — a prompt change, `create()`/`update()` by hand, a config setting.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would be willing to open a pull request for this.
