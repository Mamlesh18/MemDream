# Publish to PyPI when a version tag is pushed:
#
#   git tag -a v0.1.2 -m "MemDream 0.1.2" && git push origin v0.1.2
#
# Authentication is PyPI Trusted Publishing (OIDC): PyPI trusts this workflow
# in this repository, so there is no API token stored anywhere. A push to main
# runs the build job only, so packaging problems show up before a release.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          mod=$(grep -Po '__version__ = "\K[^"]+' memdream/__init__.py)
          echo "tag=$tag pyproject=$pkg __version__=$mod"
          test "$tag" = "$pkg" && test "$tag" = "$mod"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Installed wheel imports outside the repo
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/venv/bin/python -c "import memdream; print('memdream', memdream.__version__)"

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/memdream/
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A version uploaded by hand already is not an error: the GitHub
          # Release step after this still runs.
          skip-existing: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release from the CHANGELOG entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" > notes.md <<'EOF'
          import re, sys
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(sys.argv[1])}\][^\n]*\n(.*?)(?=^## \[|^\[)", text, re.S | re.M)
          print(m.group(1).strip() if m else f"MemDream {sys.argv[1]}")
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "MemDream $version" --notes-file notes.md --verify-tag
